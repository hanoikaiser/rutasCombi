<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editor de rutas</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw/dist/leaflet.draw.css" />
  <style>
    #map { height: 500px; margin-top: 10px; }
    body { font-family: sans-serif; margin: 20px; }
    select, button { margin-right: 10px; }
  </style>
</head>
<body>
  <h2>Editor de rutas</h2>

  <label for="rutasSelect">Seleccionar ruta:</label>
  <select id="rutasSelect"></select>

  <button id="editarRutaBtn">Editar ruta</button>
  <button id="guardarRutaBtn" disabled>Guardar cambios</button>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-draw/dist/leaflet.draw.js"></script>
  <script src="map.js"></script>
</body>
</html>
