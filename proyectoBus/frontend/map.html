<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rutas de Transporte - Arequipa</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
  <style>
    :root {
  --verde: #4CAF50;
  --verde-oscuro: #388E3C;
  --rojo: #e74c3c;
  --gris-claro: #f4f4f9;
  --sombra: rgba(0, 0, 0, 0.1);
}

body {
  margin: 0;
  font-family: "Segoe UI", Arial, sans-serif;
  background: var(--gris-claro);
}

header {
  background: var(--verde);
  color: #fff;
  padding: 1rem;
  text-align: center;
  box-shadow: 0 2px 5px var(--sombra);
}

main {
  display: grid;
  grid-template-columns: 1fr 350px;
  gap: 1rem;
  padding: 1rem;
}

#map {
  height: 85vh;
  border-radius: 10px;
  box-shadow: 0 2px 6px var(--sombra);
}

aside {
  background: #fff;
  padding: 1rem;
  border-radius: 10px;
  box-shadow: 0 2px 6px var(--sombra);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

form {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

label {
  font-weight: bold;
  margin-top: 0.5rem;
}

input, select, textarea {
  padding: 0.5rem;
  border: 1px solid #ccc;
  border-radius: 5px;
  font-size: 0.95rem;
}

button {
  padding: 0.7rem;
  border: none;
  border-radius: 5px;
  font-weight: bold;
  color: #fff;
  cursor: pointer;
  transition: background 0.2s;
}

button[type="submit"] {
  background: var(--verde);
}

button[type="submit"]:hover {
  background: var(--verde-oscuro);
}

#limpiarBtn {
  background: var(--rojo);
}

#recargarBtn {
  background: #3498db;
  margin-top: 0.5rem;
}

#listaRutas {
  margin-top: 1rem;
  border-top: 1px solid #ccc;
  padding-top: 0.5rem;
  max-height: 200px;
  overflow-y: auto;
  font-size: 0.9rem;
}

footer {
  background: #fff;
  text-align: center;
  padding: 0.8rem;
  font-size: 0.9rem;
  color: #555;
  border-top: 1px solid #ddd;
}
#limpiarBtn {
      background: #e74c3c;
    }

    #recargarBtn {
      display: block;
      margin: 0 auto 2rem auto;
      background: #3498db;
    }

    footer {
      text-align: center;
      padding: 1rem;
      background: #222;
      color: #ccc;
      font-size: 0.9rem;
    }

  </style>
</head>
<body>

  <header>
    <h1>🚌 Rutas de Transporte Público - Arequipa</h1>
  </header>

  <main>
    <div id="map"></div>

    <aside id="sidebar-info">
      <form id="formRuta">
        <h3>Agregar Nueva Ruta</h3>
        
        <label for="nombreRuta">Nombre de la ruta:</label>
        <input type="text" id="nombreRuta" placeholder="Ej: Combi 202 - Av. Parra" required>

        <label for="colorRuta">Color en el mapa:</label>
        <input type="color" id="colorRuta" value="#4CAF50">

        <label for="descripcionRuta">Descripción breve:</label>
        <textarea id="descripcionRuta" rows="3" placeholder="Ej: Recorre Av. Parra, Salaverry, y Av. Ejército"></textarea>

        <button type="submit">💾 Guardar Ruta</button>
        <button type="button" id="limpiarBtn">🧹 Limpiar</button>
        <button type="button" id="recargarBtn">🔄 Recargar Rutas</button>
      </form>

      <div id="listaRutas">
        <h4>Rutas registradas:</h4>
        <ul id="rutasGuardadas"></ul>
      </div>
    </aside>
  </main>

  <footer>
    &copy; 2025 Sistema de Transporte Urbano Arequipa — Todos los derechos reservados.
  </footer>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
